[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gstpipe"
version = "0.1.0"
description = "Synthetic GST invoice pipeline for measuring error propagation across document-processing stages"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=2",
    "pandas>=2.2",
    "reportlab>=4",
    "pymupdf>=1.24",
    "pillow>=10",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "rapidfuzz>=3",
    "matplotlib>=3.8",
    "pytesseract>=0.3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gstpipe-generate = "gstpipe.generator.cli:main"
gstpipe-render = "gstpipe.render.cli:main"
gstpipe-extract = "gstpipe.extract.cli:main"
gstpipe-app = "gstpipe.webapp.cli:main"
gstpipe-train = "gstpipe.artifacts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
